name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  MODEL_CACHE_KEY: models-gigaam-v3-silero-wespeaker-v2
  GOVORILKA_SELFTEST_EXPECT: коллеги  # слово из tests/fixtures/speech_ru.wav: самопроверка обязана его распознать

jobs:
  windows:
    runs-on: windows-latest
    env:
      GOVORILKA_DATA_DIR: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # модели нужны уже тестам: без кеша здесь проверки на настоящих моделях пропускались
      - uses: actions/cache@v4
        with:
          path: ci-data/models
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Tests
        run: python -m pytest -q tests
      - name: Version
        shell: bash
        run: echo "GOVORILKA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Build exe
        run: pyinstaller --noconfirm --clean govorilka.spec
      - name: Self-test exe (real model on test speech)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Govorilka.exe -ArgumentList "--selftest", "tests\fixtures\speech_ru.wav" -Wait -PassThru
          Get-Content ci-data\selftest.txt -Encoding utf8
          exit $p.ExitCode
      - name: Self-test UI (windows load without errors and draw something)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Govorilka.exe -ArgumentList "--selftest-ui" -Wait -PassThru
          Get-Content ci-data\selftest-ui.txt -Encoding utf8
          exit $p.ExitCode
      - name: Rename
        shell: bash
        run: mv dist/Govorilka.exe "dist/Govorilka-${GOVORILKA_VERSION:-dev}-windows-x64.exe"
      # «Установить» на этом самом файле: SHA-256 и подмена exe скриптом. Не прошло — релиза не будет
      - name: Check one-click update on the built exe
        shell: bash
        run: python tools/check_update.py dist/Govorilka-*-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Govorilka-*-windows-x64.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64  # Apple Silicon
            runner: macos-14
            min_os: "14.0"
          - arch: x86_64  # Intel
            runner: macos-15-intel
            min_os: "13.0"
    runs-on: ${{ matrix.runner }}
    env:
      GOVORILKA_DATA_DIR: ${{ github.workspace }}/ci-data
      GOVORILKA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build system audio helper (Swift)
        run: |
          mkdir -p bin
          swiftc -O -target ${{ matrix.arch }}-apple-macos${{ matrix.min_os }} mac/audiotap.swift -o bin/govorilka-audiotap
      - name: Smoke-test helper, both sources (must answer, not crash)
        run: |
          set +e
          failed=0
          for source in system mic; do
            (sleep 8) | ./bin/govorilka-audiotap --source "$source" > "/tmp/$source.raw" 2> "/tmp/$source.err"
            code=$?
            echo "--- $source: exit=$code bytes=$(wc -c < "/tmp/$source.raw")"
            cat "/tmp/$source.err"
            # у сервера сборки может не быть микрофона — тогда честная ошибка, но не падение
            grep -qE "^(ready|error:)" "/tmp/$source.err" && [ "$code" -lt 128 ] || failed=1
          done
          exit $failed
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # модели нужны уже тестам: без кеша здесь проверки на настоящих моделях пропускались
      - uses: actions/cache@v4
        with:
          path: ci-data/models
          key: ${{ env.MODEL_CACHE_KEY }}-${{ runner.os }}-${{ matrix.arch }}
      - name: Tests
        run: python -m pytest -q tests
      - name: Version
        run: echo "GOVORILKA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Build app
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          pyinstaller --noconfirm --clean govorilka.spec
          # помощник захвата звука должен лежать внутри приложения: иначе запись не запустится
          find dist/Govorilka.app -name govorilka-audiotap -type f | grep . || { echo "::error::нет govorilka-audiotap в приложении"; exit 1; }
          bash tools/mac_sign.sh dist/Govorilka.app
      - name: Self-test app (real model on test speech)
        run: |
          set +e
          dist/Govorilka.app/Contents/MacOS/Govorilka --selftest tests/fixtures/speech_ru.wav
          code=$?
          cat ci-data/selftest.txt
          exit $code
      - name: Self-test UI (windows load without errors and draw something)
        run: |
          set +e
          dist/Govorilka.app/Contents/MacOS/Govorilka --selftest-ui
          code=$?
          cat ci-data/selftest-ui.txt
          exit $code
      # настоящее окно macOS (не offscreen): программа сама жмёт кнопки и работает. Сбой — трассировка из crash.log.
      # Несколько коротких запусков по отдельности, чтобы было видно, что именно роняет программу.
      - name: Self-test live window (click every safe button)
        run: |
          set +e
          failed=0
          run_live() {
            rm -f ci-data/selftest-live.txt
            env "$@" dist/Govorilka.app/Contents/MacOS/Govorilka --selftest-live
            code=$?
            result=$(head -1 ci-data/selftest-live.txt 2>/dev/null)
            echo "=== $* -> код $code, $result"
            if [ "$code" != 0 ] || [ "${result%% *}" != OK ]; then
              failed=1
              echo "--- crash.log"; tail -n 25 ci-data/crash.log 2>/dev/null
              sleep 3   # отчёт macOS появляется не сразу
              report=$(ls -t ~/Library/Logs/DiagnosticReports/Govorilka*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && { echo "--- нативный стек ($report)"; python3 tools/ips_summary.py "$report"; rm -f "$report"; }
            fi
          }
          run_live GOVORILKA_LIVE_MODE=props
          run_live GOVORILKA_LIVE_MODE=settings
          run_live GOVORILKA_LIVE_MODE=settings MallocGuardEdges=1 MallocScribble=1 MallocErrorAbort=1
          run_live GOVORILKA_LIVE_MODE=settings DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib
          run_live GOVORILKA_LIVE_MODE=guide
          run_live GOVORILKA_LIVE_MODE=main
          run_live GOVORILKA_LIVE_MODE=all
          exit $failed
      - name: Build dmg
        run: |
          suffix=$([ "$GOVORILKA_ARCH" = arm64 ] && echo apple-silicon || echo intel)
          name="Govorilka-${GOVORILKA_VERSION:-dev}-macos-$suffix.dmg"
          mkdir dmg
          cp -R dist/Govorilka.app dmg/
          ln -s /Applications dmg/Applications
          # macOS иногда отвечает «Resource busy»: отмонтируем остатки и пробуем ещё
          hdiutil detach /Volumes/Govorilka -force 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Govorilka" -srcfolder dmg -ov -format UDZO "dist/$name" && break
            echo "hdiutil: попытка $attempt не удалась"; sleep $((attempt * 5))
            [ "$attempt" = 5 ] && exit 1
          done
      # «Установить» на этом самом образе: SHA-256, подпись тем же сертификатом, копия из образа, подмена .app
      - name: Check one-click update on the built dmg
        run: python tools/check_update.py dist/Govorilka-*-macos-*.dmg dist/Govorilka.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Govorilka-*-macos-*.dmg

  # Установка одной командой (install.ps1 / install.sh) на последнем опубликованном релизе: скачать, сверить SHA-256,
  # разложить по местам. Своя папка и без запуска, чтобы не трогать систему сборочной машины.
  installers:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GOVORILKA_INSTALL_DIR: ${{ runner.temp }}\govorilka-install
          GOVORILKA_NO_START: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:GOVORILKA_INSTALL_DIR\Govorilka.exe")) { throw 'Govorilka.exe не появился' }
      - name: install.sh
        if: runner.os == 'macOS'
        env:
          GOVORILKA_APP: ${{ runner.temp }}/Govorilka.app
          GOVORILKA_NO_OPEN: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install.sh
          test -x "$GOVORILKA_APP/Contents/MacOS/Govorilka"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Говорилка $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
