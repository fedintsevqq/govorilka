# Обновления зависимостей: Dependabot раз в неделю открывает pull request, CI проверяет его тестами и сборкой.
# Версии Python-пакетов в requirements.txt закреплены точно (сборка должна повторяться), поэтому обновления
# приходят отдельными pull request, а не молча.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    # onnxruntime: после 1.23.2 нет колёс для Mac на Intel. PySide6: с 6.12 нужен macOS 14, а мы держим 13.
    ignore:
      - dependency-name: "onnxruntime"
      - dependency-name: "PySide6-Essentials"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python:
        update-types: ["minor", "patch"]
